[workspace]
resolver = "3"
members = [
    "crates/core-base",
    "crates/core-text",
    "crates/core-diff",
    "crates/core-vfs",
    "crates/core-glob",
    "crates/core-folder",
    "crates/core-sync",
    "crates/core-tools",
    "crates/shell-ext",
    "crates/core-ffi",
    "tools/dsdev",
    "tools/xtask",
    "tests/readme",
]
# fuzz/ is its own workspace: it needs nightly + cargo-fuzz (E0-S6.4).
exclude = ["fuzz", "reference_source"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Versions are pinned exactly by Cargo.lock (plan.md §2.2). Keep this list to what the
# workspace really uses.
[workspace.dependencies]
# internal (dependency direction: base → text/vfs → diff/glob → folder → sync → ffi)
core-base = { path = "crates/core-base" }
core-text = { path = "crates/core-text" }
core-diff = { path = "crates/core-diff" }
core-vfs = { path = "crates/core-vfs" }
core-glob = { path = "crates/core-glob" }
core-folder = { path = "crates/core-folder" }
core-sync = { path = "crates/core-sync" }
core-tools = { path = "crates/core-tools" }

# external
unicode-normalization = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Ioctl"] }
crc32fast = "1.5"
encoding_rs = "0.8"
memchr = "2.8"
memmap2 = "0.9"
parking_lot = "0.13"
slotmap = "1.1"
rayon = "1.12"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
cbindgen = { version = "0.29", default-features = false }
csbindgen = "1.9"

# dev only
criterion = { version = "0.8", default-features = false }
imara-diff = "0.2"
insta = "1.49"
proptest = "1.12"
tempfile = "3.27"
cc = "1.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.cargo]
# Versions live in [workspace.dependencies] ahead of the epics that use them.
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
# Curated pedantic set (plan.md §2.1). The groups are enabled, then the noisy lints that
# fight the exact-arithmetic style of the aligner are turned off with a reason.
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow" # line indexes are u32 by design; checked where it matters
cast_possible_wrap = "allow"       # same: i64 run arithmetic mirrors the spec
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"      # progress fractions and stats are display values
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"            # src/tgt style names
too_many_lines = "allow"
too_many_arguments = "allow"       # block/gap helpers carry (s0, s1, t0, t1, ...) explicitly
many_single_char_names = "allow"
struct_excessive_bools = "allow"   # option structs mirror the spec's flag list
return_self_not_must_use = "allow"
doc_markdown = "allow"
struct_field_names = "allow"       # ignore_case on RuleOptions-like structs is the spec name
case_sensitive_file_extension_comparisons = "allow" # fixture names are ASCII and ours
format_push_string = "allow"       # test and fixture builders
format_collect = "allow"           # same
manual_string_new = "allow"        # "".into() reads better in expected-value tables
manual_midpoint = "allow"          # (lo + hi) / 2 on bounded lengths reads clearer than midpoint
semicolon_if_nothing_returned = "allow" # match arms returning () read better without it
naive_bytecount = "allow"            # tests count tiny slices
trivially_copy_pass_by_ref = "allow"  # trait methods take &CopyOptions by design
unused_self = "allow"              # trait-shaped helpers
unreadable_literal = "allow"       # Win32 constants are clearer as written
assert_is_empty = "allow"          # assert!(x.is_empty()) is the clearer failure in tests

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"                 # the FFI panic barrier needs unwinding (plan.md §2.1)
debug = "line-tables-only"

[profile.dev]
# The aligner and its property tests are heavy; a little optimisation keeps `cargo test` fast.
opt-level = 1

[profile.test]
opt-level = 1
